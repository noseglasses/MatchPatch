[project]
name = "matchpatch-example-device-plugin"
version = "0.1.0"
description = "Minimal MatchPatch device plugin example"
requires-python = ">=3.12"
dependencies = [
    "matchpatch",
]

[project.entry-points."matchpatch.devices"]
example-device = "matchpatch_example_device:ExampleDeviceProfile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
